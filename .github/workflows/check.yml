name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json

      # Each package has BOTH a deno.json (what JSR publishes) and a package.json
      # (what a local `file:` consumer reads). Name and version therefore exist
      # twice per package, and nothing else would notice them diverging — the
      # symptom would be a consumer pinned to a version that was never published.
      - name: manifests agree
        run: |
          for p in packages/*/; do
            node -e '
              const fs = require("fs"), d = process.argv[1]
              const j = JSON.parse(fs.readFileSync(d + (fs.existsSync(d + "/deno.json") ? "/deno.json" : "/jsr.json")))
              const n = JSON.parse(fs.readFileSync(d + "/package.json"))
              for (const k of ["name", "version"]) {
                if (j[k] !== n[k]) {
                  console.error(`${d}: deno.json ${k}=${j[k]} but package.json ${k}=${n[k]}`)
                  process.exit(1)
                }
              }
              console.log(`  ${j.name}@${j.version} consistent`)
            ' "$p"
          done
      # The same check the publish will run, so a package that cannot be
      # published fails here rather than on a tag.
      # The seam carries the only logic in this repo intricate enough to be
      # worth unit tests: request-aware fixture resolution.
      # --no-lock, deliberately. A lockfile here broke three releases in a row:
      # bumping the version changes packages/assay's dependency on the seam to a
      # version that does not exist YET, so the lock cannot be resolved until
      # after the publish it is supposed to gate. The only locked dependency was
      # a pinned @std/assert, so it was buying almost nothing.
      - run: deno test --allow-all --no-lock
        working-directory: packages/assay-seam

      - run: deno publish --dry-run
        working-directory: packages/assay-seam
      - run: deno publish --dry-run
        working-directory: packages/assay
